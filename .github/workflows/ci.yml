name: Login App CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 1: LINT (Syntax & Quality Validation)
  # ==========================================
  lint:
    name: 1. Lint Code & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Run Syntax Linting
        run: npm run lint

      - name: Validate SAM Template
        run: sam validate

  # ==========================================
  # STAGE 2: TEST (Unit Tests)
  # ==========================================
  test:
    name: 2. Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backend Authentication Unit Tests
        run: npm test

  # ==========================================
  # STAGE 3: BUILD (SAM Build & Package Dist)
  # Runs only after Lint AND Test pass!
  # ==========================================
  build:
    name: 3. Build & Package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build Backend (AWS SAM)
        run: sam build

      - name: Package Frontend Production Files
        run: |
          mkdir -p dist/frontend
          cp -r frontend/* dist/frontend/
          echo "Built on $(date -u)" > dist/build-info.txt
          echo "Build complete: production files packaged into dist/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: login-app-production-build
          path: |
            dist/
            .aws-sam/
            template.yaml
            samconfig.toml

  # ==========================================
  # STAGE 4: DEPLOY (AWS SAM & S3 / CloudFront)
  # Runs only after Build succeeds!
  # ==========================================
  deploy:
    name: 4. Deploy Application
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: login-app-production-build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Check AWS Credentials Availability
        id: aws-auth-check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "AWS credentials detected in repository secrets."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "AWS credentials not configured in repository secrets."
          fi

      - name: Configure AWS Credentials
        if: steps.aws-auth-check.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy AWS SAM Backend Stack
        if: steps.aws-auth-check.outputs.has_creds == 'true'
        run: |
          echo "🚀 Deploying AWS SAM stack..."
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Deploy Frontend to S3 & Invalidate CloudFront Cache
        if: steps.aws-auth-check.outputs.has_creds == 'true'
        run: |
          STACK_NAME="sma-login-vilas"
          echo "🔍 Fetching CloudFormation stack outputs..."

          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='ApiURL'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          WEBSITE_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" --output text)

          # Fallback lookup if DistributionId was not part of older stack outputs
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            DISTRIBUTION_ID=$(aws cloudformation describe-stack-resource --stack-name $STACK_NAME --logical-resource-id Distribution --query "StackResourceDetail.PhysicalResourceId" --output text)
          fi

          echo "Target S3 Bucket: $BUCKET_NAME"
          echo "API URL: $API_URL"
          echo "CloudFront Distribution: $DISTRIBUTION_ID"

          # Dynamically update API_URL in frontend script before syncing
          if [ -n "$API_URL" ] && [ "$API_URL" != "None" ]; then
            sed -i "s|const API_URL = .*|const API_URL = \"$API_URL\";|g" dist/frontend/script.js
            echo "Updated dist/frontend/script.js with deployed API URL."
          fi

          echo "Uploading frontend files to s3://$BUCKET_NAME/..."
          aws s3 sync dist/frontend/ "s3://$BUCKET_NAME/" --delete

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for Distribution: $DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
          fi

          echo "WEBSITE_URL=$WEBSITE_URL" >> $GITHUB_ENV
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "DEPLOY_STATUS=Live AWS Deployment Successful" >> $GITHUB_ENV

      - name: Simulated Deployment (Fallback if AWS secrets not configured)
        if: steps.aws-auth-check.outputs.has_creds != 'true'
        run: |
          echo "ℹ️ Note: Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub Secrets to enable live deployment."
          echo "🚀 Simulating deployment of Login application..."
          echo "Files packaged in dist/frontend:"
          ls -la dist/frontend/
          echo "✅ Application package validated and ready for production deployment!"
          echo "WEBSITE_URL=https://sample-preview.cloudfront.net" >> $GITHUB_ENV
          echo "API_URL=https://sample-api.execute-api.us-east-1.amazonaws.com/login" >> $GITHUB_ENV
          echo "DEPLOY_STATUS=Simulated / Package Validated (Configure AWS secrets to deploy live)" >> $GITHUB_ENV

      - name: Job Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Stages Passed:** Lint ➔ Test ➔ Build ➔ Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ env.DEPLOY_STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** [${{ env.WEBSITE_URL }}](${{ env.WEBSITE_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API Endpoint:** \`${{ env.API_URL }}\`" >> $GITHUB_STEP_SUMMARY
