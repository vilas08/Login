
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM login demo

Resources:
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: index.handler
      Runtime: nodejs24.x
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref LoginApi
            Path: /login
            Method: POST

  LoginApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: Frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - POST
            - OPTIONS
          CachedMethods:
            - POST
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  WebsiteURL:
    Description: CloudFront frontend URL
    Value: !Sub 'https://${Distribution.DomainName}'

  BucketName:
    Description: Private S3 bucket name
    Value: !Ref FrontendBucket

  ApiURL:
    Description: API Gateway login endpoint
    Value: !Sub 'https://${LoginApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/login'
